<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-run setup mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:#e9edf3;font-family:'Noto Sans Bengali',sans-serif;color:#0B1F3A}
h1{font-size:18px;margin:0 0 16px}
.cap{font:500 13px sans-serif;color:#4F5F76;margin:18px 0 6px}
.f{border-radius:14px;overflow:hidden;border:1px solid #9aa7ba;box-sizing:border-box;display:flex;flex-direction:column;line-height:1.5}
.L{--pg:#F4F6FA;--sf:#fff;--tx:#0B1F3A;--t2:#4F5F76;--ln:#D5DBE6;--fo:#8A97AB;--tint:#EEF1F7;--ok:#0B1F3A;--okt:#fff}
.D{--pg:#0B1F3A;--sf:#12294A;--tx:#fff;--t2:#B4C2D8;--ln:#2E4A75;--fo:#6C86AD;--tint:#1E3A66;--ok:#fff;--okt:#0B1F3A}
.f{background:var(--pg);color:var(--tx)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.logo{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.4px}
.logo span{color:#FF5C39}
.lang{display:flex;border:1px solid var(--ln);border-radius:20px;overflow:hidden;font-size:13px}
.lang b{font-weight:500;padding:6px 14px;color:var(--t2)}
.lang b.a{background:var(--tx);color:var(--pg)}
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 24px 24px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:26px;width:100%;max-width:880px;box-sizing:border-box;display:flex;gap:32px}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.h{font-size:22px;font-weight:700;margin:0;line-height:1.35}
.p{font-size:15px;color:var(--t2);margin:0}
.steps{display:flex}
.s{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--t2);position:relative;text-align:center}
.s i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;background:var(--sf);z-index:1}
.s.k i{background:var(--ok);border-color:var(--ok);color:var(--okt)}
.s.c i{border:2px solid #FF5C39;color:var(--tx);font-weight:500}
.s.c,.s.k{color:var(--tx)}
.s:not(:last-child)::after{content:"";position:absolute;top:14px;left:50%;width:100%;height:1.5px;background:var(--ln)}
.s.k:not(:last-child)::after{background:var(--ok)}
.chip{font-size:13px;background:var(--tint);border-radius:10px;padding:10px 14px}
.fld{position:relative;border:1px solid var(--fo);border-radius:10px;height:52px;display:flex;align-items:center;padding:0 14px;font-size:15px;color:var(--t2)}
.fld em{position:absolute;top:-9px;left:10px;background:var(--sf);padding:0 4px;font-style:normal;font-size:12px;color:var(--t2)}
.fld.f1{border:2px solid var(--tx)}.fld.f1 em{color:var(--tx)}
.btn{height:52px;border-radius:10px;background:#D23F1E;color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.txt{height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500}
.row{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
</style>
</head>
<body>
<h1>First-run setup · doctor license · 4 variants</h1>
<div id="r"></div>
<script>
const steps=`<div class="steps"><div class="s k"><i>✓</i>অ্যাডমিন</div><div class="s k"><i>✓</i>ডাক্তার</div><div class="s c"><i>৩</i>চেম্বার</div><div class="s"><i>৪</i>শেষ</div></div>`;
const chip=`<div class="chip">ডাক্তার লাইসেন্স · ৫টির মধ্যে ০টি চেম্বার যোগ হয়েছে</div>`;
const intro=`<p class="h">প্রথম চেম্বারটি যোগ করুন</p><p class="p">এই চেম্বারেই রোগীরা সিরিয়াল নেবেন। চাইলে পরে আরও চেম্বার যোগ করতে পারবেন।</p>`;
const top=`<div class="top"><span class="logo">Algoriti<span>Q</span></span><div class="lang"><b class="a">বাংলা</b><b>English</b></div></div>`;
const fields=`<div class="fld f1"><em>চেম্বারের নাম</em></div><div class="fld"><em>ফোন নম্বর</em></div><div class="fld"><em>ঠিকানা</em></div>`;
const acts=`<div class="btn">চেম্বার সংরক্ষণ করুন</div><div class="txt">এখন নয়, পরে করব</div>`;
const land=t=>`<div class="f ${t}" style="height:560px">${top}<div class="wrap"><div class="card"><div class="col">${intro}${steps}${chip}</div><div class="col" style="justify-content:center">${fields}${acts}</div></div></div></div>`;
const port=t=>`<div class="f ${t}" style="width:400px;height:780px">${top}<div class="wrap" style="align-items:flex-start"><div class="card" style="flex-direction:column;gap:16px;padding:20px">${intro}${steps}${chip}${fields}${acts}</div></div></div>`;
document.getElementById('r').innerHTML=
`<p class="cap">Landscape · light</p>${land('L')}<p class="cap">Landscape · dark</p>${land('D')}<div class="row"><div><p class="cap">Portrait · light</p>${port('L')}</div><div><p class="cap">Portrait · dark</p>${port('D')}</div></div>`;
</script>
</body>
</html>
