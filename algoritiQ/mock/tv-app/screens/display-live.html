<!doctype html>
<html lang="bn" data-theme="light" class="device-view locale-bn" data-safe-area="on">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ওয়েটিং রুম · টিভি</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/tv.css" />
  </head>
  <body>
    <div class="board" data-tv-display-root>
      <aside class="board__identity">
        <div class="identity__stack">
          <div class="identity__photo-wrap">
            <img class="identity__photo" data-tv-doctor-photo src="/assets/doctor-photo.jpg" alt="" />
            <div class="identity__photo-fallback" data-tv-doctor-photo-fallback hidden aria-hidden="true">ডা</div>
          </div>
          <div class="identity__doctor">
            <h1 class="identity__name" data-tv-doctor-name></h1>
            <p class="identity__degrees" data-tv-doctor-degrees></p>
            <p class="identity__meta">
              <span data-tv-doctor-designation></span>
            </p>
            <p class="identity__meta identity__meta--soft" data-tv-doctor-specialty></p>
            <p class="identity__sub" data-tv-doctor-workplace></p>
            <p class="identity__sub" data-tv-doctor-bmdc></p>
          </div>
          <div class="identity__divider" aria-hidden="true"></div>
          <div class="identity__chamber">
            <h2 class="identity__chamber-name" data-tv-chamber-name></h2>
            <p class="identity__sub" data-tv-chamber-location></p>
            <p class="identity__phone" data-tv-chamber-phone></p>
          </div>
        </div>
      </aside>

      <div class="board__queue-side">
        <div class="audience-clock" aria-live="off">
          <p class="audience-clock__time" data-tv-clock>—</p>
        </div>

        <section class="call-panel" data-tv-called-panel aria-live="polite">
          <div class="call-panel__head">
            <h2 class="call-panel__title" data-l10n="announcement">ঘোষণা</h2>
            <span class="call-panel__speaker" data-tv-announce-speaker hidden aria-hidden="true"></span>
          </div>
          <div class="call-panel__body">
            <p class="call-panel__label" data-l10n="nowServing">এখন ডাকা হচ্ছে</p>
            <p class="call-number is-live" data-tv-called-serial>১০০৮</p>
            <span class="call-type" data-tv-called-type>সাধারণ</span>
            <p class="call-panel__empty" data-tv-called-empty hidden data-l10n="noCalledYet">এখনও কাউকে ডাকা হয়নি</p>
          </div>
        </section>

        <section class="queue-panel">
          <header class="queue-panel__head">
            <h2 class="queue-panel__title" data-l10n="waitingNext">অপেক্ষমাণ</h2>
          </header>
          <div class="queue-rows">
            <div class="queue-row" data-tv-waiting="regular">
              <span class="queue-row__label" data-l10n="queueRegular">সাধারণ</span>
              <ul class="queue-row__list" data-tv-serial-list></ul>
              <span class="queue-row__more" data-tv-serial-more hidden></span>
            </div>
            <div class="queue-row" data-tv-waiting="report">
              <span class="queue-row__label" data-l10n="queueReport">রিপোর্ট</span>
              <ul class="queue-row__list" data-tv-serial-list></ul>
              <span class="queue-row__more" data-tv-serial-more hidden></span>
            </div>
            <div class="queue-row" data-tv-waiting="dressing">
              <span class="queue-row__label" data-l10n="queueDressing">ড্রেসিং</span>
              <ul class="queue-row__list" data-tv-serial-list></ul>
              <span class="queue-row__more" data-tv-serial-more hidden></span>
            </div>
          </div>
        </section>
      </div>

      <div class="tv-mock-bar" data-tv-mock-bar>
        <span data-l10n="mockSimulateCall">ডাক সিমুলেট (মক)</span>
        <button type="button" data-tv-call-regular data-l10n="queueRegular">সাধারণ</button>
        <button type="button" data-tv-call-report data-l10n="queueReport">রিপোর্ট</button>
        <button type="button" data-tv-call-dressing data-l10n="queueDressing">ড্রেসিং</button>
        <button type="button" data-tv-clear-called data-l10n="mockClearCalled">ডাক মুছুন</button>
      </div>
    </div>
    <script type="module" src="/src/screen-frame.js"></script>
    <script type="module" src="/src/display-live.js"></script>
  </body>
</html>
