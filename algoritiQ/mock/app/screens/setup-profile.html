<!doctype html>
<html lang="en" data-theme="light" class="device-view device-view--portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setup profile · AlgoritiQ mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div class="app-root">
      <div class="card-page">
        <header class="card-page__top">
          <div class="logo" aria-label="AlgoritiQ">
            <div class="logo__mark" aria-hidden="true">
              <span class="logo__bar logo__bar--1"></span>
              <span class="logo__bar logo__bar--2"></span>
              <span class="logo__bar logo__bar--3"></span>
            </div>
            <span class="logo__text">Algoriti<span>Q</span></span>
          </div>
          <div class="lang-switch" role="group" data-l10n-aria="languageLabel" aria-label="Language">
            <span class="lang-switch__track" aria-hidden="true"></span>
            <button type="button" class="lang-switch__seg" data-lang="bn" aria-pressed="false">বাংলা</button>
            <button type="button" class="lang-switch__seg" data-lang="en" aria-pressed="true">EN</button>
          </div>
        </header>
        <div class="card-page__scroll">
          <div class="card-page__inner card-page__inner--setup-wide">
            <div class="card card--flat">
              <div class="setup-header-wide">
                <h2 data-l10n="profileTitle">Your profile</h2>
                <div class="step-progress">
                  <div class="step-progress__item step-progress__item--current" data-l10n="setupStepProfile">Your profile</div>
                  <div class="step-progress__item" data-l10n="setupStepChambers">Chambers</div>
                  <div class="step-progress__item" data-l10n="setupStepReady">Ready</div>
                </div>
              </div>
              <div class="setup-header-narrow stack-md">
                <h1 class="app-headline" data-l10n="profileTitle">Your profile</h1>
                <p class="text-intro" data-l10n="profileIntro">This is shown on the TV and on tokens.</p>
                <div class="step-progress">
                  <div class="step-progress__item step-progress__item--current" data-l10n="setupStepProfile">Your profile</div>
                  <div class="step-progress__item" data-l10n="setupStepChambers">Chambers</div>
                  <div class="step-progress__item" data-l10n="setupStepReady">Ready</div>
                </div>
              </div>
              <div class="stack-lg two-col-form two-col-form--wide" style="margin-top: var(--space-lg)">
                <div class="stack-md">
                  <div class="field"><label data-l10n="doctorNameLabel">Full name, with title</label><input value="Dr. Farhana Rahman" readonly /></div>
                  <div class="field"><label data-l10n="designationLabel">Designation</label><input value="Consultant" readonly /></div>
                  <div class="field"><label data-l10n="degreesLabel">Degrees</label><input value="MBBS, FCPS (Cardiology)" readonly /></div>
                  <div class="field"><label data-l10n="specialtyLabel">Specialty</label><input value="Cardiology" readonly /></div>
                </div>
                <div class="stack-md">
                  <div class="doctor-summary">
                    <div class="doctor-summary__photo">👩‍⚕️</div>
                    <div>
                      <button type="button" class="btn btn--outline" style="width: auto" data-l10n="changePhotoButton">Change photo</button>
                      <p class="text-small" style="margin-top: var(--space-sm)" data-l10n="mockSetupPhotoHint">Shown on the TV and tokens.</p>
                    </div>
                  </div>
                  <div class="field"><label data-l10n="workplaceLabel">Workplace</label><input value="City Heart Clinic" readonly /></div>
                  <button type="button" class="btn btn--primary" data-l10n="continueButton">Continue</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/screen-frame.js"></script>
  </body>
</html>
