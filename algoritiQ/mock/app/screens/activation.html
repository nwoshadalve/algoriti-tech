<!doctype html>
<html lang="en" data-theme="light" class="device-view device-view--portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activate device · AlgoritiQ mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div class="app-root">
      <div class="card-page">
        <header class="card-page__top">
          <div class="logo" aria-label="AlgoritiQ">
            <div class="logo__mark" aria-hidden="true">
              <span class="logo__bar logo__bar--1"></span>
              <span class="logo__bar logo__bar--2"></span>
              <span class="logo__bar logo__bar--3"></span>
            </div>
            <span class="logo__text">Algoriti<span>Q</span></span>
          </div>
          <div class="lang-switch" role="group" aria-label="Language">
            <span class="lang-switch__track" aria-hidden="true"></span>
            <button type="button" class="lang-switch__seg" data-lang="bn">বাংলা</button>
            <button type="button" class="lang-switch__seg lang-switch__seg--on" data-lang="en">EN</button>
          </div>
        </header>
        <div class="card-page__scroll">
          <div class="card-page__inner card-page__inner--two-col">
            <div class="card card--flat two-col-form two-col-form--wide">
              <div class="stack-lg">
                <div>
                  <h1 class="app-headline">Activate this device</h1>
                  <p class="text-intro">Send this device code to your provider to get an activation key.</p>
                </div>
                <div class="stepper">
                  <span class="stepper__step stepper__step--active">① Copy code</span>
                  <span class="stepper__step">② Get key</span>
                  <span class="stepper__step">③ Enter key</span>
                </div>
                <div>
                  <p class="text-label">Device code</p>
                  <div class="device-code" style="margin-top: var(--space-sm)">
                    <span>AQ7K-3MNP-92XF</span>
                    <span class="chip-btn">Copy</span>
                  </div>
                </div>
              </div>
              <div class="stack-lg">
                <div class="field">
                  <label for="activation-key">Activation key</label>
                  <input id="activation-key" type="text" placeholder="Paste or type the key" readonly />
                </div>
                <button type="button" class="btn btn--primary">Activate</button>
              </div>
            </div>
          </div>
          <div class="card-page__footer">
            <span aria-hidden="true">🔒</span>
            <span>Your license is tied to this device and works offline.</span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/screen-frame.js"></script>
  </body>
</html>
