<!doctype html>
<html lang="en" data-theme="light" class="device-view device-view--portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · AlgoritiQ mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div class="app-root">
      <div class="card-page">
        <header class="card-page__top">
          <div class="logo" aria-label="AlgoritiQ">
            <div class="logo__mark" aria-hidden="true">
              <span class="logo__bar logo__bar--1"></span>
              <span class="logo__bar logo__bar--2"></span>
              <span class="logo__bar logo__bar--3"></span>
            </div>
            <span class="logo__text">Algoriti<span>Q</span></span>
          </div>
          <div class="lang-switch" role="group" data-l10n-aria="languageLabel" aria-label="Language">
            <span class="lang-switch__track" aria-hidden="true"></span>
            <button type="button" class="lang-switch__seg" data-lang="bn" aria-pressed="false">বাংলা</button>
            <button type="button" class="lang-switch__seg" data-lang="en" aria-pressed="true">EN</button>
          </div>
        </header>
        <div class="card-page__scroll">
          <div class="card-page__inner card-page__inner--two-col">
            <div class="card card--flat two-col-form two-col-form--wide">
              <div class="stack-md">
                <h1 class="app-headline" data-l10n="signInTitle">Sign in</h1>
                <p class="text-intro" data-l10n="signInIntro">Use the username or email and the password of your admin account.</p>
              </div>
              <div class="stack-md">
                <div class="field"><label data-l10n="signInIdentifierLabel">Username or email</label><input value="rina.reception" readonly /></div>
                <div class="field"><label data-l10n="signInPasswordLabel">Password</label><input type="password" value="••••••••" readonly /></div>
                <label class="checkbox-row">
                  <input type="checkbox" checked disabled />
                  <span><span data-l10n="signInRemember">Remember me on this tablet</span><small data-l10n="signInRememberHint">Stay signed in for 30 days. Use only on your own device.</small></span>
                </label>
                <button type="button" class="btn btn--primary" data-l10n="signInButton">Sign in</button>
                <button type="button" class="btn btn--ghost" data-l10n="signInForgot">Forgot password?</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/screen-frame.js"></script>
  </body>
</html>
