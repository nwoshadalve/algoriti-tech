<!doctype html>
<html lang="en" data-theme="light" class="device-view device-view--portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connectivity · AlgoritiQ mock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/app.css" />
  </head>
  <body>
    <div class="app-root">
      <div class="dashboard">
        <button type="button" class="dashboard__scrim" data-drawer-scrim hidden aria-label="Close menu"></button>
        <aside class="dashboard__drawer side-nav" aria-label="Dashboard sections" aria-hidden="true">
          <div class="side-nav__head">
            <div class="logo" aria-label="AlgoritiQ">
              <div class="logo__mark" aria-hidden="true">
                <span class="logo__bar logo__bar--1"></span>
                <span class="logo__bar logo__bar--2"></span>
                <span class="logo__bar logo__bar--3"></span>
              </div>
              <span class="logo__text">Algoriti<span>Q</span></span>
            </div>
            <button type="button" class="side-nav__close" data-drawer-close aria-label="Close menu">×</button>
          </div>
          <div class="side-nav__list">
            <button type="button" class="nav-tile">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h6v16H4V4zm10 0h6v10h-6V4zM4 20h16v2H4v-2z"/></svg>
              Board
            </button>
            <button type="button" class="nav-tile nav-tile--selected" aria-current="page">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
              Connectivity
            </button>
          </div>
          <div class="side-nav__user">
            <button type="button" class="user-menu-trigger" aria-haspopup="menu" aria-label="Account menu">
              <span class="avatar">R</span>
              <span class="user-menu-trigger__text">
                <strong>Rina Karim</strong>
                <span class="text-small">Receptionist</span>
              </span>
              <svg class="user-menu-trigger__chev" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 10l5 5 5-5H7z"/></svg>
            </button>
          </div>
        </aside>
        <div class="dashboard__main">
          <header class="dashboard__top">
            <button type="button" class="nav-menu-btn" data-drawer-open aria-label="Open menu" aria-expanded="false">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
            </button>
            <div class="dashboard__top-logo">
              <div class="logo" aria-label="AlgoritiQ">
                <div class="logo__mark" aria-hidden="true">
                  <span class="logo__bar logo__bar--1"></span>
                  <span class="logo__bar logo__bar--2"></span>
                  <span class="logo__bar logo__bar--3"></span>
                </div>
                <span class="logo__text">Algoriti<span>Q</span></span>
              </div>
            </div>
            <div class="work-scope--compact">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
              <span>Main chamber</span>
            </div>
            <div class="dashboard-toolbar">
              <div class="lang-switch" role="group" aria-label="Language">
                <span class="lang-switch__track" aria-hidden="true"></span>
                <button type="button" class="lang-switch__seg" data-lang="bn">বাংলা</button>
                <button type="button" class="lang-switch__seg lang-switch__seg--on" data-lang="en">EN</button>
              </div>
              <button type="button" class="theme-toggle" data-mock-theme-toggle aria-label="Switch to dark theme"></button>
            </div>
          </header>
          <main class="dashboard__content">
            <div style="max-width: var(--content-max); margin: 0 auto">
              <header class="page-header">
                <h2>Connectivity</h2>
                <p>Check that the printer and the TV screen are connected.</p>
              </header>
              <div class="connectivity-grid">
                <div class="connectivity-card">
                  <div class="connectivity-card__head">
                    <div class="connectivity-card__icon">
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                    </div>
                    <h3 class="connectivity-card__title">Printer</h3>
                    <span class="status-pill status-pill--good">
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
                      Connected
                    </span>
                  </div>
                  <p class="text-intro">Ready to print tokens.</p>
                  <p style="font-weight: 700; margin: var(--space-sm) 0">Brother PT-P300BT</p>
                  <div class="btn-row">
                    <button type="button" class="btn btn--outline" style="flex: 1">Test print</button>
                    <button type="button" class="btn btn--outline" style="flex: 1">Choose printer</button>
                  </div>
                </div>
                <div class="connectivity-card">
                  <div class="connectivity-card__head">
                    <div class="connectivity-card__icon">
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3H3c-1.1 0-2 .89-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
                    </div>
                    <h3 class="connectivity-card__title">TV screen</h3>
                    <span class="status-pill status-pill--wait">
                      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
                      Coming soon
                    </span>
                  </div>
                  <p class="text-intro">You will check and connect the waiting-room TV here.</p>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
    <script type="module" src="/src/screen-frame.js"></script>
  </body>
</html>
